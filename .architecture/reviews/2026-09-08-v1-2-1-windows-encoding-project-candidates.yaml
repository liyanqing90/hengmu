summary:
  architecture: Hengmu 1.2.1 retains the existing nine-Skill, schema-bound architecture governance package.
    The patch optimizes safe Knowledge parsing and exact golden similarity work; adds explicit local changed-line
    coverage and namespace coverage reporting, including the Windows Git UTF-8 decoding correction discovered
    by hosted CI; removes unconsumed internal helpers; and documents focused local validation without
    weakening formal gates. No public Skill, artifact schema, dependency lock, Knowledge content, Rule
    Pack, Evidence Provider or publication algorithm changes occur. This is a fresh candidate assessment
    across all 31 loaded rules and six critical flows, with zero candidate findings, not an independent
    verification or a model-behavior result.
  raw_findings: 0
  confirmed: 0
  rejected: 0
  needs_evidence: 0
