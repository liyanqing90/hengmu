problem:
  quality_attributes:
  - compatibility
  - maintainability
  - deterministic-enforcement
  constraints:
  - Retain public Skill names, artifact schemas, safe parsing, the exact 0.88 similarity threshold, and
    immutable release contracts.
  - Keep the patch scoped to validated Knowledge performance, local changed-line coverage, namespace coverage,
    and internal maintenance.
  - Require fresh source-bound independent review, passed deterministic evidence, hosted quality gates,
    two-format package integrity and a current Codex host smoke before publication.
  finding_ids: []
  assumptions:
  - The explicit user request to publish follows the concrete recommendation to release these fixes as
    v1.2.1.
  - No additional runtime or persisted-data migration is required for the scoped patch.
  known_facts:
  - The current independent Review is bound by its raw SHA-256 and has zero Findings across all 31 rules
    and six critical flows.
  - The clean locked-environment Provider passed 372 JUnit cases with zero failures/errors/skips; the
    earlier missing-coverage environment failure is preserved separately.
  - Both 1.2.1 package formats passed byte-for-byte rebuild comparison, extracted runtime smoke, checksums,
    dependency and license audits, and SBOM generation.
  - The current desktop host reloaded the installed 1.2.1 Skill catalog; installed runtime version and
    Knowledge validation were observed.
  unknowns:
  - Hosted final-commit CI and immutable publication remain external completion gates.
  - The standalone CLI route attempts were unsuccessful due host tool plumbing; only the current desktop
    routing observation is claimed.
  - No stochastic model-quality or additional host-support claim is made.
